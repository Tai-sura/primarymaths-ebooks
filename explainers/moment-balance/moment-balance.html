<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>力矩平衡 · 蹺蹺板（jpfm08 p3）</title>
<style>
  :root { --ink:#23231f; --ink2:#63635a; --line:#dcd7ca; --card:#fffefb; --accent:#2f6fbf; --amber:#b47a17; --red:#b03c2c; --green:#2e7d5b; }
  html,body { margin:0; padding:0; background:#f4f1ea; color:var(--ink);
    font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif; }
  #app { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:18px;
    max-width:1180px; margin:0 auto; padding:14px 16px 10px; }
  #stage { background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:6px; touch-action:none; min-width:0; }
  #canvas-holder { display:block; line-height:0; }
  #canvas-holder canvas { display:block; width:100% !important; height:auto !important; border-radius:4px; }
  h1 { font-size:16px; margin:0 0 2px; font-weight:600; }
  .sub { color:var(--ink2); font-size:12px; margin:0 0 9px; }
  .presets { display:flex; gap:8px; margin:0 0 10px; }
  .presets button { flex:1; font:inherit; font-size:12px; padding:6px 4px; border:1px solid var(--line);
    border-radius:6px; background:#fff; color:var(--ink); cursor:pointer; }
  .presets button:hover { background:#f6f3ec; }
  .presets button.on { border-color:var(--accent); color:var(--accent); }
  .row { display:flex; align-items:center; gap:8px; margin:0 0 7px; }
  .row label { width:64px; flex:none; color:var(--ink2); font-size:12px; }
  .row input[type=range] { flex:1; min-width:0; accent-color:var(--accent); height:18px; }
  .row output { width:64px; flex:none; text-align:right; font-variant-numeric:tabular-nums; }
  .read { border-top:1px solid var(--line); padding-top:9px; margin-top:6px; }
  .read div { display:flex; justify-content:space-between; gap:10px; font-variant-numeric:tabular-nums;
    padding:2px 0; font-size:13px; }
  .read span:first-child { color:var(--ink2); }
  .state { margin-top:6px; font-size:13.5px; font-weight:600; color:var(--red); min-height:20px; }
  .state.balanced { color:var(--green); }
  .cap { font-size:11px; color:#8a887f; margin-top:9px; line-height:1.5; }
  @media (max-width:900px) { #app { grid-template-columns:minmax(0,1fr); } }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><div id="canvas-holder"></div></div>
  <div id="panel">
    <h1>力矩平衡 · 蹺蹺板</h1>
    <p class="sub">順時針力矩 = 逆時針力矩 就平衡；力矩 M = F × d。</p>

    <div class="presets">
      <button id="p3" type="button">q3 · 600 N @ 6 m</button>
      <button id="p5" type="button">q5 · 500 N / 300 N</button>
    </div>

    <div class="row">
      <label for="fl">左重量</label>
      <input id="fl" type="range" min="100" max="800" step="10" value="500">
      <output id="fl-out">500 N</output>
    </div>
    <div class="row">
      <label for="dl">左距離</label>
      <input id="dl" type="range" min="1" max="10" step="0.5" value="5">
      <output id="dl-out">5 m</output>
    </div>
    <div class="row">
      <label for="fr">右重量</label>
      <input id="fr" type="range" min="100" max="800" step="10" value="300">
      <output id="fr-out">300 N</output>
    </div>
    <div class="row">
      <label for="dr">右距離</label>
      <input id="dr" type="range" min="1" max="10" step="0.5" value="5">
      <output id="dr-out">5 m</output>
    </div>

    <div class="read">
      <div><span>逆時針力矩（左邊）</span><span id="o-acw">—</span></div>
      <div><span>順時針力矩（右邊）</span><span id="o-cw">—</span></div>
      <div><span>差額（順 − 逆）</span><span id="o-diff">—</span></div>
    </div>
    <div class="state" id="state">—</div>
    <div class="cap">印刷數字：600 N、6 m、9 m（q3）；500 N、300 N、10 m（q5）。樑的重量忽略；
      所有讀數由 M = F × d 即時算出。載入時靜止，拖 slider 才有變化。
      q4（木板 100 N）需要同側兩個載荷（第三個載荷），這一頁暫不支援。</div>
  </div>
</div>

<script src="../p5.min.js"></script>
<script>
const S = { fl: 500, dl: 5, fr: 300, dr: 5 };
const MAX_TILT = 0.16;            // 最大傾角（弧度），純視覺
const C = {
  paper: [251, 250, 247], ground: [224, 219, 208], ink: [35, 35, 31], ink2: [99, 99, 90],
  beam: [138, 106, 69], left: [47, 111, 191], right: [180, 122, 23], green: [46, 125, 91],
};

function moments() { return { acw: S.fl * S.dl, cw: S.fr * S.dr }; }
const num = (v) => (Math.round(v * 10) / 10).toFixed(1).replace(/\.0$/, '');

function sync() {
  document.getElementById('fl-out').textContent = S.fl + ' N';
  document.getElementById('dl-out').textContent = num(S.dl) + ' m';
  document.getElementById('fr-out').textContent = S.fr + ' N';
  document.getElementById('dr-out').textContent = num(S.dr) + ' m';

  const { acw, cw } = moments();
  const diff = cw - acw;
  document.getElementById('o-acw').textContent = acw + ' N·m';
  document.getElementById('o-cw').textContent = cw + ' N·m';
  document.getElementById('o-diff').textContent = (diff > 0 ? '+' : '') + num(diff) + ' N·m';

  const state = document.getElementById('state');
  if (Math.abs(diff) < 0.5) {
    state.className = 'state balanced';
    state.textContent = '平衡：F = ' + S.fr + ' N（' + S.fl + ' N × ' + num(S.dl) + ' m = ' +
      S.fr + ' N × ' + num(S.dr) + ' m = ' + acw + ' N·m）';
  } else if (diff > 0) {
    state.className = 'state';
    state.textContent = '右邊下沉：順時針大 ' + num(diff) + ' N·m';
  } else {
    state.className = 'state';
    state.textContent = '左邊下沉：逆時針大 ' + num(-diff) + ' N·m';
  }
}

function setState(fl, dl, fr, dr) {
  S.fl = fl; S.dl = dl; S.fr = fr; S.dr = dr;
  document.getElementById('fl').value = String(fl);
  document.getElementById('dl').value = String(dl);
  document.getElementById('fr').value = String(fr);
  document.getElementById('dr').value = String(dr);
  sync();
  redraw();
}

function canvasSize() {
  const holder = document.getElementById('canvas-holder');
  const w = Math.max(320, Math.floor(holder.clientWidth || 800));
  const h = Math.max(420, Math.min(700, window.innerHeight - 120, Math.round(w * 0.9) + 120));
  return { w, h };
}

function setup() {
  const { w, h } = canvasSize();
  const c = createCanvas(w, h);
  c.parent('canvas-holder');
  noLoop();
  textFont('system-ui, sans-serif');
  sync();
  redraw();
}

function windowResized() {
  const { w, h } = canvasSize();
  resizeCanvas(w, h);
  redraw();
}

function draw() {
  const W = width, H = height;
  const { acw, cw } = moments();
  const diff = cw - acw;
  const ref = Math.max(acw, cw, 1);
  const tilt = Math.max(-1, Math.min(1, diff / ref)) * MAX_TILT;

  const half = Math.max(Math.max(S.dl, S.dr) + 0.15, 2.6);   // 樑的半長（米）：剛好到最遠那個磅
  const ppm = (W / 2 - 54) / half;                          // 每米像素：隨距離自動定
  const cx = W / 2;
  const cy = H * 0.30;
  const ground = cy + H * 0.18;
  const barTop = H * 0.60;
  const barH = Math.max(16, H * 0.042);
  const stateY = H * 0.84;

  const cos = Math.cos(tilt), sin = Math.sin(tilt);
  const at = (m) => [cx + m * ppm * cos, cy + m * ppm * sin];

  background(...C.paper);

  // 地面
  stroke(...C.ground); strokeWeight(1);
  line(20, ground, W - 20, ground);

  // 支點（三角座 + 軸針）
  noStroke(); fill(58, 56, 50);
  triangle(cx - 34, ground, cx + 34, ground, cx, cy + 3);

  // 樑
  push();
  translate(cx, cy);
  rotate(tilt);
  stroke(...C.beam); strokeWeight(9); strokeCap(ROUND);
  line(-half * ppm, 0, half * ppm, 0);
  pop();

  // 左右兩邊：磅、力箭咀、距離標註
  side(-S.dl, S.fl, C.left);
  side(S.dr, S.fr, C.right);

  // 軸針最後畫，短臂時磅都唔會遮住支點
  noStroke(); fill(...C.paper); stroke(58, 56, 50); strokeWeight(1.5);
  circle(cx, cy, 9);
  noStroke();

  // 轉向箭咀：邊一邊力矩大，就指向那一邊轉
  if (Math.abs(diff) > 0.5) {
    const r = 42;
    noFill(); stroke(47, 111, 191, 170); strokeWeight(1.6);
    arc(cx, cy, r * 2, r * 2, PI, TWO_PI);   // 上半圓，由左掃去右（順時針）
    noStroke(); fill(47, 111, 191);
    if (diff > 0) triangle(cx + r - 5, cy - 9, cx + r + 5, cy - 9, cx + r, cy + 2);
    else triangle(cx - r - 5, cy - 9, cx - r + 5, cy - 9, cx - r, cy + 2);
    textAlign(CENTER, BOTTOM); textSize(11); fill(47, 111, 191);
    text(diff > 0 ? '順時針' : '逆時針', cx, cy - r - 7);
  } else {
    textAlign(CENTER, BOTTOM); textSize(11); fill(...C.green);
    text('力矩相等', cx, cy - 52);
  }

  // 兩角讀數（窄畫面改成兩行，唔會撞埋）
  const narrow = W < 620;
  noStroke();
  if (narrow) {
    textSize(11); fill(...C.ink2);
    textAlign(LEFT, TOP);
    text('逆時針 ' + S.fl + '×' + num(S.dl) + ' = ' + acw + ' N·m', 18, 14);
    text('順時針 ' + S.fr + '×' + num(S.dr) + ' = ' + cw + ' N·m', 18, 32);
  } else {
    textSize(12); fill(...C.ink2);
    textAlign(LEFT, TOP);
    text('逆時針（左）  ' + S.fl + ' N × ' + num(S.dl) + ' m = ' + acw + ' N·m', 22, 18);
    textAlign(RIGHT, TOP);
    text('順時針（右）  ' + S.fr + ' N × ' + num(S.dr) + ' m = ' + cw + ' N·m', W - 22, 18);
  }

  // 力矩條：長度 ∝ 力矩，左右對照，一眼睇出邊邊大
  const maxM = Math.max(acw, cw, 1);
  const unit = (W / 2 - 96) / maxM;
  const midY = barTop + barH / 2;
  stroke(216, 210, 198); strokeWeight(1);
  line(40, midY, W - 40, midY);
  noStroke();
  fill(...C.left); rect(cx - acw * unit, barTop, acw * unit, barH, 2);
  fill(...C.right); rect(cx, barTop, cw * unit, barH, 2);
  fill(58, 56, 50);
  rect(cx - 1.5, barTop - 9, 3, barH + 18);
  textSize(11.5);
  fill(...C.ink2);
  if (narrow) {
    textAlign(LEFT, TOP); text('逆時針 ' + acw + ' N·m', 40, barTop + barH + 8);
    textAlign(RIGHT, TOP); text('順時針 ' + cw + ' N·m', W - 40, barTop + barH + 8);
    textAlign(CENTER, TOP); textSize(12);
    text('力矩條長度 = 力 × 距離', cx, barTop + barH + 30);
  } else {
    textAlign(LEFT, BOTTOM); text('逆時針 ' + acw + ' N·m', cx - acw * unit, barTop - 10);
    textAlign(RIGHT, BOTTOM); text('順時針 ' + cw + ' N·m', cx + cw * unit, barTop - 10);
    textAlign(CENTER, TOP); textSize(13); fill(...C.ink2);
    text('力矩條長度 = 力 × 距離', cx, barTop + barH + 22);
  }

  // 底部狀態
  textAlign(CENTER, BOTTOM); textSize(15);
  if (Math.abs(diff) < 0.5) {
    fill(...C.green);
    text('平衡 —— 順時針 = 逆時針 = ' + acw + ' N·m', cx, stateY);
  } else if (diff > 0) {
    fill(176, 60, 44);
    text('右邊下沉（順時針大 ' + num(diff) + ' N·m）', cx, stateY);
  } else {
    fill(176, 60, 44);
    text('左邊下沉（逆時針大 ' + num(-diff) + ' N·m）', cx, stateY);
  }
  textAlign(CENTER, BOTTOM); textSize(11); fill(...C.ink2);
  text('樑重忽略 · 讀數由 M = F × d 算出', cx, H - 16);

  function side(m, force, colour) {
    const [px, py] = at(m);
    // 磅（直立方塊，坐在樑上）
    noStroke(); fill(...colour);
    rect(px - 24, py - 34, 48, 34, 4);
    fill(255, 255, 255, 42);
    rect(px - 24, py - 34, 48, 7, 4, 4, 0, 0);
    // 力箭咀（向下，重力）
    stroke(...colour); strokeWeight(2); strokeCap(ROUND);
    line(px, py + 6, px, py + 64);
    noStroke(); fill(...colour);
    triangle(px - 6, py + 55, px + 6, py + 55, px, py + 66);
    textAlign(LEFT, CENTER); textSize(13); fill(...C.ink);
    text(force + ' N', px + 10, py + 46);
    // 距離標註：由支點沿樑拉到磅，偏下 20 px
    const nx = -sin, ny = cos;
    const ax = cx + nx * 20, ay = cy + ny * 20;
    const bx = px + nx * 20, by = py + ny * 20;
    stroke(150, 144, 132); strokeWeight(1);
    line(ax, ay, bx, by);
    for (const [ox, oy] of [[ax, ay], [bx, by]]) {
      line(ox - cos * 6, oy - sin * 6, ox + cos * 6, oy + sin * 6);
    }
    noStroke(); fill(110, 106, 96);
    textAlign(CENTER, TOP); textSize(12);
    text(num(Math.abs(m)) + ' m', (ax + bx) / 2, (ay + by) / 2 + 4);
  }
}

function bindSlider(id, key, scale) {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    S[key] = Number(el.value) * scale;
    sync();
    redraw();
  });
}
bindSlider('fl', 'fl', 1);
bindSlider('dl', 'dl', 1);
bindSlider('fr', 'fr', 1);
bindSlider('dr', 'dr', 1);

document.getElementById('p3').addEventListener('click', () => {
  setState(600, 6, 300, 9);     // 右邊重量留給學生拖：拖到 400 N 就平衡
});
document.getElementById('p5').addEventListener('click', () => {
  setState(500, 5, 300, 5);     // 10 m 樑、兩邊各 5 m；重的要移入 2 m（3 m）才平衡
});
</script>
</body>
</html>
